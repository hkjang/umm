      x-required-scope: webhooks:write
      responses: { '204': { description: Webhook deleted } }
  /webhooks/{webhookId}/test:
    parameters:
      - { $ref: '#/components/parameters/WebhookID' }
    post:
      operationId: post_webhooks_webhookId_test
      tags: [Webhooks]
      summary: Send a signed connection-test event
      x-required-scope: webhooks:write
      responses: { '200': { description: Delivery succeeded }, '502': { $ref: '#/components/responses/Error' } }
  /webhooks/{webhookId}/rotate-secret:
    parameters:
      - { $ref: '#/components/parameters/WebhookID' }
    post:
      operationId: post_webhooks_webhookId_rotate_secret
      tags: [Webhooks]
      summary: Replace the webhook HMAC secret
      description: The new secret is returned exactly once.
      x-required-scope: webhooks:write
      responses: { '200': { description: One-time replacement secret } }
  /dreams:
    get:
      operationId: get_dreams
      tags: [Dream]
      summary: List personal Dreams whose spaces the caller can currently access, with authorized sources and review status
      x-required-scope: dreams:read
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses: { '200': { description: Dream inbox, content: { application/json: { schema: { type: object, required: [dreams, nextCursor], properties: { dreams: { type: array, items: { $ref: '#/components/schemas/DreamCandidate' } }, nextCursor: { type: string } } } } } } }
  /dreams/{dreamId}/feedback:
    parameters:
      - { in: path, name: dreamId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_dreams_dreamId_feedback
      tags: [Dream]
      summary: Record idempotent Dream feedback under a transaction-locked current space membership
      x-required-scope: dreams:read
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [exposed, kept, edited, connected, expanded, moved, deleted, hidden, regenerated] }, reason: { type: string, enum: [too_obvious, irrelevant, incorrect, repetitive, too_frequent] } } } } } }
      responses: { '200': { description: Feedback recorded } }
  /dreams/{dreamId}/accept:
    parameters:
      - { in: path, name: dreamId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_dreams_dreamId_accept
      tags: [Dream]
      summary: Accept a staged Dream and materialize its note and source edges
      x-required-scope: [dreams:read, notes:write]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { content: { type: string, maxLength: 2000, description: Optional developed content to accept instead of the original candidate } } } } } }
      responses: { '201': { description: Accepted canvas note, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } } }
  /dreams/{dreamId}/regenerate:
    parameters:
      - { in: path, name: dreamId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_dreams_dreamId_regenerate
      tags: [Dream]
      summary: Generate a distinct alternative from the same source notes
      description: Locks the Dream, eligible source notes, source spaces and current memberships through the external AI call so completed access revocation prevents prompt dispatch and state changes.
      x-required-scope: dreams:read
      responses: { '200': { description: Replaced Dream candidate, content: { application/json: { schema: { $ref: '#/components/schemas/DreamCandidate' } } } }, '429': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /dreams/{dreamId}/develop:
    parameters:
      - { in: path, name: dreamId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_dreams_dreamId_develop
      tags: [Dream]
      summary: Expand, challenge or turn a Dream into actions
      description: Holds a transaction-scoped lease on the Dream, eligible sources and every current space membership until the external AI call finishes.
      x-required-scope: dreams:read
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [expand, challenge, actions] } } } } } }
      responses: { '200': { description: Developed Dream text, content: { application/json: { schema: { type: object, required: [mode, content, model, inputTokens, outputTokens], properties: { mode: { type: string }, content: { type: string }, model: { type: string }, inputTokens: { type: integer }, outputTokens: { type: integer } } } } } }, '429': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /dreams/{dreamId}/developed-note:
    parameters:
      - { in: path, name: dreamId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_dreams_dreamId_developed_note
      tags: [Dream]
      summary: Atomically save developed Dream text as a note and expanded edge
      description: Identical retries return the existing note and edge with created=false.
      x-required-scope: [dreams:read, notes:write]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, minLength: 1, maxLength: 2000 } } } } } }
      responses:
        '200': { description: Existing materialization returned for an identical retry, content: { application/json: { schema: { $ref: '#/components/schemas/DevelopmentMaterialization' } } } }
        '201': { description: Developed note and edge created atomically, content: { application/json: { schema: { $ref: '#/components/schemas/DevelopmentMaterialization' } } } }
  /approvals:
    get:
      operationId: get_approvals
      tags: [Workflow]
      summary: List requests visible to the user, team lead or administrator
      responses: { '200': { description: Approval requests } }
    post:
      operationId: post_approvals
      tags: [Workflow]
      summary: Request review for an action
      description: If the administrator has not enabled this action, returns required=false and approved without creating a workflow record.
      x-required-scope: approvals:write
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [resourceType, resourceId, action], properties: { resourceType: { type: string }, resourceId: { type: string, format: uuid }, action: { type: string }, comment: { type: string } } } } }
      responses: { '200': { description: No workflow required }, '201': { description: Pending request created } }
  /approvals/{requestId}/decision:
    parameters:
      - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_approvals_requestId_decision
      tags: [Workflow]
      summary: Approve or reject as matching team lead or administrator
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved, rejected] }, comment: { type: string } } } } } }
      responses: { '200': { description: Decision saved }, '403': { $ref: '#/components/responses/Error' } }
  /admin/settings:
    get:
      operationId: get_admin_settings
      tags: [Admin]
      summary: Get all service settings with masked secrets
      responses: { '200': { description: Setting sections } }
  /admin/settings/{section}:
    parameters:
      - { in: path, name: section, required: true, schema: { type: string, enum: [general, oidc, security, workflow, dream, ai_gateway] } }
    put:
      operationId: put_admin_settings_section
      tags: [Admin]
      summary: Replace one settings section
      description: >
        OIDC client_secret and the AI gateway's api_key and embedding_api_key are AES-256-GCM
        encrypted before PostgreSQL storage. Masked secret saves merge the latest ciphertext
        under the same per-setting transaction lock used by master-key rotation.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Saved }, '400': { $ref: '#/components/responses/Error' } }
  /admin/oidc/test:
    post:
      operationId: post_admin_oidc_test
      tags: [Admin]
      summary: Test OIDC Discovery and client configuration
      responses: { '200': { description: Discovery succeeded }, '400': { $ref: '#/components/responses/Error' } }
  /admin/users:
    get:
      operationId: get_admin_users
      tags: [Admin]
      summary: List users, roles, teams and status
      responses: { '200': { description: Users } }
  /admin/users/{userId}:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: put_admin_users_userId
      tags: [Admin]
      summary: Update role, active state and team
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role, active, teamName], properties: { role: { type: string, enum: [user, team_lead, admin] }, active: { type: boolean }, teamName: { type: string } } } } } }
      responses: { '200': { description: User updated } }
  /admin/metrics:
    get:
      operationId: get_admin_metrics
      tags: [Admin]
      summary: Get product, Dream quality, token and cost metrics
      responses: { '200': { description: Current operational metrics } }
  /edges/{edgeId}:
    delete:
      operationId: delete_edge
      tags: [Notes]
      summary: Remove a connection
      description: Also how an inferred suggestion is dismissed. Requires edit or manage permission on the space.
      parameters:
        - { name: edgeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Connection removed }
        '404': { $ref: '#/components/responses/Error' }
  /edges/{edgeId}/accept:
    post:
      operationId: accept_edge_suggestion
      tags: [Notes, AI]
      summary: Stand behind an inferred connection
      description: |
        Turns an edge with origin=auto into origin=manual and clears its
        confidence: once a person has decided a connection is real, a score
        describing how far it stood out from the rest of the workspace no longer
        says anything about it. Only inferred edges can be accepted.
      parameters:
        - { name: edgeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The accepted connection, content: { application/json: { schema: { $ref: '#/components/schemas/Edge' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /spaces/{spaceId}/links/suggest:
    post:
      operationId: suggest_links
      tags: [Notes, AI]
      summary: Propose connections between thoughts that sit unusually close
      description: |
        Scores every pair in the space against the workspace's own distribution
        and records the ones that stand out as edges with origin=auto and a
        confidence, which the interface shows as suggestions.

        It refuses to run unless the configured embedding backend has been
        measured as semantic (see /admin/embedding-quality). The offline default
        ranks two sentences that share words above two that share meaning, so
        proposing from it would connect notes that merely reuse vocabulary. The
        outcome field says which case applied.
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: What the run produced and why, content: { application/json: { schema: { $ref: '#/components/schemas/SuggestionResult' } } } }
        '500': { $ref: '#/components/responses/Error' }
  /ai/ask:
    post:
      operationId: post_ai_ask
      tags: [AI, Notes]
      summary: Answer a question from the person's own thoughts
      description: |
        Retrieves what the person already wrote and answers only from that. The
        sources are returned in the order the model was given them, so a citation
        like [2] resolves and a claim with no citation is visible as one.

        Retrieval searches and then follows one step along the graph, because the
        answer to a question is often recorded next to the thought that raises it
        rather than inside it.

        Nothing marked as excluded from AI reaches the gateway — not by search and
        not through a connection. excluded counts what was left out, so a partial
        answer does not read as a complete one.

        When nothing matched, grounded is false and no model is called: an answer
        with no sources is the failure this endpoint exists to avoid, and asking
        for one anyway invites it. Requires a configured chat model and consumes
        the AI quota.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [question], properties: { question: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: The answer and what it stands on
          content:
            application/json:
              schema:
                type: object
                required: [answer, sources, excluded, grounded]
                properties:
                  answer: { type: string, description: Empty when grounded is false }
                  grounded: { type: boolean, description: False when nothing matched and no model was called }
                  excluded: { type: integer, minimum: 0, description: Thoughts that matched but are excluded from AI }
                  model: { type: string }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [ref, noteId, spaceId, content, via]
                      properties:
                        ref: { type: integer, minimum: 1, description: The number the answer cites }
                        noteId: { type: string, format: uuid }
                        spaceId: { type: string, format: uuid }
                        content: { type: string }
                        via: { type: string, enum: [match, connection] }
        # 412 means no chat model is configured. It is separate from 502 because
        # an administrator can fix it in a minute, and separate from the embedding
        # model, which this endpoint does not use.
        '400': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /spaces/{spaceId}/branches:
    get:
      operationId: get_space_branches
      tags: [Notes]
      summary: List the lines of thinking in a space
      description: |
        A branch is a line of thinking that was explored: named by a person, and
        resolved by a person as adopted or abandoned.

        umm never decides a line was abandoned on its own. A month of silence is
        not a decision, and treating it as one would quietly bury work that was
        merely paused.

        assignments maps each thought to the branch it belongs to, so a caller can
        label a note without walking every branch.
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The lines and which thoughts are filed under each
          content:
            application/json:
              schema:
                type: object
                required: [branches, assignments]
                properties:
                  branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                  assignments:
                    type: object
                    description: noteId to branchId
                    additionalProperties: { type: string, format: uuid }
        '500': { $ref: '#/components/responses/Error' }
    post:
      operationId: post_space_branches
      tags: [Notes]
      summary: Start a line of thinking
      description: |
        The root thought is optional. A line often grows out of something already
        written, but not always, and requiring one would push people to invent a
        parent note that says nothing. When given, it must be a thought in the
        same space.
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                rootNoteId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: The line, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /branches/{branchId}/resolve:
    post:
      operationId: post_branch_resolve
      tags: [Notes]
      summary: Record what became of a line, and why
      description: |
        The reason is required and the request is refused without one. A branch
        marked abandoned with no reason is the same forgetting this feature exists
        to prevent, one step later: you know you rejected it and no longer know
        what for.

        Once a line is abandoned, every thought in it is labelled as such wherever
        it surfaces — search, /ai/ask sources, and the assistant's lookups. That
        labelling is the point: a rejected option that reads as current is how
        someone acts on it twice.
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution]
              properties:
                status: { type: string, enum: [adopted, abandoned] }
                resolution: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { description: The resolved line, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /branches/{branchId}/reopen:
    post:
      operationId: post_branch_reopen
      tags: [Notes]
      summary: Put a resolved line back in play
      description: |
        Separate from resolving because it is a different thing to say. The reason
        is cleared, since it described a decision that no longer stands and would
        read as current if it stayed.
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The reopened line, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /branches/{branchId}:
    delete:
      operationId: delete_branch
      tags: [Notes]
      summary: Stop tracking a line
      description: |
        The thoughts stay. Removing a branch means the line is no longer tracked,
        not that the thinking never happened.
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Removed, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /notes/{noteId}/branch:
    put:
      operationId: put_note_branch
      tags: [Notes]
      summary: File a thought under a line, or take it out of one
      description: |
        A null branchId clears it. The branch must be in the same space as the
        thought, otherwise the label would refer to something its readers cannot
        see.
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branchId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: Filed, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /turning-points:
    get:
      operationId: get_turning_points
      tags: [Notes]
      summary: What changed in someone's thinking, in the order it changed
      description: |
        Six months later the question is rarely "what did I write" but "what did
        we decide about this, and why". The reason is the part that goes missing
        first, so it travels with the decision.

        Everything here was marked by a person: a line of thinking adopted or set
        aside, a question marked as answered, two thoughts marked as being in
        tension. umm does not read a burst of activity and call it a turning
        point, and it does not decide a line was abandoned because it went quiet.
        A record that mixes decisions with guesses is worse than no record,
        because when you need it you cannot tell which is which.

        An open line is not here. Nothing has been decided yet, and listing it
        would turn a record of decisions into a list of work in progress.

        Newest first, capped at 120. Only spaces the person can read.
      parameters:
        - name: spaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Narrow to one space. Omitted, it covers every space they can read.
      responses:
        '200':
          description: What was marked, newest first
          content:
            application/json:
              schema:
                type: object
                required: [points, hasMore]
                properties:
                  hasMore:
                    type: boolean
                    description: >
                      True when there are marked decisions older than the newest 120 returned.
                      A record that stops without saying so reads as the whole story.
                  points:
                    type: array
                    items:
                      type: object
                      required: [kind, at, spaceId, space, subject, detail]
                      properties:
                        kind:
                          type: string
                          enum: [adopted, abandoned, answered, contradicted]
                        at: { type: string, format: date-time }
                        spaceId: { type: string, format: uuid }
                        space: { type: string }
                        subject: { type: string, description: The line's name, the question, or the claim }
                        detail:
                          type: string
                          description: >
                            Why a line was resolved, the thought that answered a question, or
                            the counter-claim. Empty when there is no second half, rather than
                            filled with something invented.
                        noteId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /ai/agent:
    post:
      operationId: post_ai_agent
      tags: [AI, Notes]
      summary: Let an assistant look around before answering
      description: |
        Answers a question the way a person would: it looks, reads what it found,
        and looks again if it needs to, instead of answering from one retrieval.

        It reads and never writes. The tools bound to the model are all lookups
        (search, questions marked open, contradictions marked by hand) — nothing
        that creates, links, merges or deletes is offered at all, so a proposal
        comes back as text for the person to act on. That boundary is the tool
        list itself, not a permission flag.

        steps records every lookup it made, so an answer can be checked rather
        than taken on faith. Nothing marked as excluded from AI is reachable
        through any tool, and excluded counts what was held back across all of
        them.

        Each turn is one model call charged to the person's daily quota, and a
        run is capped at 6 lookups. When the cap is reached the assistant is
        asked once more without tools so what it learned is not lost, and
        truncated is true — the answer was cut short, not concluded. Requires a
        configured chat model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [task], properties: { task: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: The answer and every lookup behind it
          content:
            application/json:
              schema:
                type: object
                required: [answer, steps, excluded, truncated]
                properties:
                  answer: { type: string }
                  truncated: { type: boolean, description: True when the step cap was reached before the assistant finished }
                  excluded: { type: integer, minimum: 0, description: Thoughts left out because they are excluded from AI, summed over every lookup }
                  model: { type: string }
                  steps:
                    type: array
                    description: What the assistant looked at, in order
                    items:
                      type: object
                      required: [tool, input, summary]
                      properties:
                        tool: { type: string, enum: [search_thoughts, find_open_questions, find_contradictions] }
                        input: { type: string, description: The arguments the model chose, as JSON }
                        summary: { type: string, description: What that lookup returned, in one line }
        '400': { $ref: '#/components/responses/Error' }
        # 412 means no chat model is configured, same as /ai/ask.
        '412': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /open-questions:
    get:
      operationId: get_open_questions
      tags: [Notes]
      summary: Questions nothing has been recorded as answering
      description: |
        Both halves are marked, not inferred. umm does not read a note and decide
        it is asking something — a sentence ending in a question mark often is
        not a question, and a real question is often written without one — and it
        does not decide that another note answers it.

        Open therefore means nobody has drawn an answer, not that umm searched
        for one. An empty result is not "everything is answered", and a caller
        must not present it as such.

        attempts counts connections pointing at the question that are not
        answers: the difference between a question nobody has touched and one
        that has been argued over without settling.
      parameters:
        - { name: spaceId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Open questions, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [questions]
                properties:
                  questions:
                    type: array
                    items:
                      type: object
                      required: [note, spaceId, space, attempts]
                      properties:
                        note: { $ref: '#/components/schemas/Note' }
                        spaceId: { type: string, format: uuid }
                        space: { type: string }
                        attempts: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
  /contradictions:
    get:
      operationId: get_contradictions
      tags: [Notes]
      summary: Disagreements that were recorded between thoughts
      description: |
        Recorded, not detected. umm does not read two notes and conclude they
        conflict; these are connections a person or an agent drew with the
        contradicts relation.

        That difference decides how the result may be presented: an empty list
        means nobody has marked any disagreement, not that the workspace is free
        of them, so a caller must not render a zero beside the word.
      parameters:
        - { name: spaceId, in: query, required: false, schema: { type: string, format: uuid }, description: Narrow to one space; omit for every space the caller can read }
      responses:
        '200':
          description: Recorded disagreements, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [contradictions]
                properties:
                  contradictions:
                    type: array
                    items:
                      type: object
                      required: [edgeId, spaceId, space, claim, counter, origin]
                      properties:
                        edgeId: { type: string, format: uuid }
                        spaceId: { type: string, format: uuid }
                        space: { type: string }
                        claim: { $ref: '#/components/schemas/Note' }
                        counter: { $ref: '#/components/schemas/Note' }
                        origin: { type: string, description: Who recorded the disagreement }
        '400': { $ref: '#/components/responses/Error' }
  /morning-brief:
    get:
      operationId: get_morning_brief
      tags: [Notes, AI]
      summary: What accumulated while you were away
      description: |
        Counts only what umm actually produced. There is no row for
        contradictions or for thoughts whose importance rose, because umm detects
        neither, and a zero beside a category it never examined would read as
        "there are none" rather than "nobody looked".

        For the same reason the response carries `skipped`: an empty duplicates
        list means something different depending on whether the embedding backend
        was fit to find them. `quiet` is true only when there is nothing to report
        *and* nothing was skipped — the one case where "nothing happened" is the
        whole story.

        Dreams are omitted for a key without the dreams:read scope; the rest of
        the brief is still returned.
      parameters:
        - { name: hours, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 2160, default: 24 }, description: How far back to look. Defaults to a day, the cadence Dream runs on. }
      responses:
        '200': { description: The brief, content: { application/json: { schema: { $ref: '#/components/schemas/MorningBrief' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /capture:
    post:
      operationId: post_capture
      tags: [Notes]
      summary: Write a thought down without choosing where it belongs
      description: |
        Takes no space id on purpose. A thought arrives before you know where it
        goes, and asking first is why thoughts get written somewhere else. The
        thought lands in the caller's inbox — an ordinary space, so search,
        embeddings, Dream and connections all work on it — and can be filed later
        with /notes/{noteId}/move.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string } } }
      responses:
        '201': { description: The captured thought, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /notes/{noteId}/merge:
    post:
      operationId: post_note_merge
      tags: [Notes]
      summary: Fold one thought into another
      description: |
        The path note survives; mergeId is soft-deleted.

        content is required and is not derived: umm can tell that two notes say
        nearly the same thing, but not which words the person wants to keep, and
        concatenating them produces a note that says everything twice.

        Eight tables hang off a note, and each is handled deliberately rather
        than left to a cascade. Connections and comments follow the thought;
        connections that would become a note linked to itself, or a duplicate of
        one the survivor already had, are dropped and counted. Dream citations
        follow. Review schedules and revisions stay behind, because a schedule is
        one person's recall timing for a card they saw and a revision is the
        history of a row that is going away — carrying either across would
        describe the surviving thought with events that did not happen to it.
        The survivor's stored vector is discarded, since it describes text that
        no longer exists.

        Both notes must be in the same space and writable. A connection needs
        both endpoints in one space, so merging across spaces would either strand
        the connections or move a thought somewhere its author did not put it.
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mergeId, content]
              properties:
                mergeId: { type: string, format: uuid }
                content: { type: string, description: What the surviving thought says }
      responses:
        '200':
          description: The surviving thought and what moved
          content:
            application/json:
              schema:
                type: object
                required: [note, movedEdges, droppedEdges, movedComments]
                properties:
                  note: { $ref: '#/components/schemas/Note' }
                  movedEdges: { type: integer, minimum: 0 }
                  droppedEdges: { type: integer, minimum: 0, description: Self-links and duplicates the survivor already had }
                  movedComments: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /notes/{noteId}/move:
    post:
      operationId: post_note_move
      tags: [Notes]
      summary: File a thought into another space
      description: |
        Requires write access to both the origin and the destination.

        Connections are scoped to a space and need both endpoints in it, so a
        note that leaves cannot keep them: they are removed and the count comes
        back as removedEdges, so a caller can say what the move costs before the
        person agrees rather than have them discover it afterwards.
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [spaceId], properties: { spaceId: { type: string, format: uuid } } }
      responses:
        '200':
          description: The filed thought and what the move removed
          content:
            application/json:
              schema:
                type: object
                required: [note, removedEdges]
                properties:
                  note: { $ref: '#/components/schemas/Note' }
                  removedEdges: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /notes/{noteId}/space-suggestions:
    get:
      operationId: get_note_space_suggestions
      tags: [Notes, AI]
      summary: Where a captured thought might belong
      description: |
        basis says what the ranking rests on. "meaning" when the embedding
        backend has been measured as semantic and the ranking is by closeness to
        what each space holds; "recent" when it has not, in which case these are
        simply the spaces worked in most recently. Presenting word overlap as
        understanding would be worse than admitting the limit, so umm says which
        it is doing.
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Candidate homes, best first
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [space, score, basis]
                      properties:
                        space: { $ref: '#/components/schemas/Space' }
                        score: { type: number }
                        basis: { type: string, enum: [meaning, recent] }
  /admin/ai-gateway/discover:
    get:
      operationId: get_admin_ai_gateway_discover
      tags: [Admin, AI]
      summary: Look for an embedding gateway at the addresses umm documents
      description: |
        Removes the last piece of friction in configuring a real embedding model:
        knowing what it is called. Each reachable gateway is asked for its
        OpenAI-compatible model list.

        The addresses probed are compiled into the binary and are never read from
        the request — probing a supplied address would make this endpoint a way
        of reaching whatever the server can reach.

        likelyEmbedding is a hint from the model name, not a finding: a gateway
        lists every model it serves and nothing in the response says which ones
        embed. It puts the plausible ones first; /admin/ai-gateway/test and
        /admin/embedding-quality are what settle it.
      responses:
        '200':
          description: Gateways that answered, in the order umm prefers them
          content:
            application/json:
              schema:
                type: object
                required: [gateways]
                properties:
                  gateways:
                    type: array
                    items:
                      type: object
                      required: [baseUrl, models]
                      properties:
                        baseUrl: { type: string }
                        models:
                          type: array
                          items:
                            type: object
                            required: [name, likelyEmbedding]
                            properties:
                              name: { type: string }
                              likelyEmbedding: { type: boolean }
  /admin/ptium/test:
    post:
      operationId: post_admin_ptium_test
      tags: [Admin]
      summary: Check that Ptium answers and accepts the key
      description: |
        Lists Ptium's templates, which is an authenticated read: a reply proves
        the address answers, that it is a Ptium, and that the credential works —
        all three at once. Without it the first sign of a wrong address or a
        rejected key is someone trying to make a deck and being handed a status
        code they cannot act on.

        An omitted or masked api_key falls back to the stored one, so an
        administrator can test an unchanged connection without retyping the
        secret. The templates come back with the result so the settings screen
        can offer them by name rather than asking for a pasted UUID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url: { type: string }
                api_key: { type: string }
                timeout_seconds: { type: integer }
      responses:
        '200':
          description: Ptium answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        kind: { type: string }
        '400': { description: No address, a malformed one, or Ptium refused }
  /admin/ai-gateway/test:
    post:
      operationId: post_admin_ai_gateway_test
      tags: [Admin, AI]
      summary: Probe an embedding gateway before saving it
      description: |
        Embeds two short strings against the supplied address and model and
        reports what happened. This separates the two failures an administrator
        can fix from this screen — a wrong address and a wrong model name — from
        the third, a working model that is not semantic, which
        /admin/embedding-quality answers.

        An omitted or masked api_key falls back to the stored one, so an
        unchanged gateway can be tested without retyping the secret. A key that
        cannot be decrypted is treated as absent rather than sent as ciphertext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding_model]
              description: >
                Probes the gateway embeddings are actually sent to. With embedding_base_url set
                that address is used and api_key is not sent there; otherwise base_url and
                api_key are, which is where embeddings go in that case. One of the two
                addresses is required. Resolved by the same rule the runtime uses, so a
                passing probe means the server that embeds is the one that passed.
              properties:
                base_url: { type: string, description: Chat gateway address; used for embeddings when no embedding address is set }
                embedding_base_url: { type: string, description: Where embeddings go, when they have their own server }
                embedding_model: { type: string }
                api_key: { type: string, description: Sent only when base_url is the address being probed }
                embedding_api_key:
                  type: string
                  description: >
                    Sent when embedding_base_url is the address being probed. Empty means no
                    authentication — the common case for an embedding server — and only the
                    mask means "the one already saved".
      responses:
        '200':
          description: The probe result. ok is false with a detail when the gateway refused or was unreachable; this is not an HTTP error because the request itself succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  detail: { type: string, description: Present when ok is false }
                  model: { type: string }
                  dimensions: { type: integer, description: Vector width the gateway returned }
        '400': { $ref: '#/components/responses/Error' }
  /admin/embedding-quality:
    get:
      operationId: get_admin_embedding_quality
      tags: [Admin, AI]
      summary: Measure what the configured embedding backend actually captures
      description: |
        Scores a hand-labelled set of Korean and English sentence pairs with the
        configured embedding backend and reports whether it separates meaning
        from shared vocabulary. discrimination is mean(paraphrase) - mean(lexical-decoy)
        and pairwiseAccuracy is the fraction of paraphrase-versus-decoy comparisons
        ranked the right way round. neighbourPurity measures the separate question
        related thoughts and clustering actually ask: across labelled topic groups,
        how often is a sentence's nearest match from its own topic. A lexical
        backend scores near zero on the first pair and near chance on the second,
        and every feature that reports related thoughts, clusters or Dream pairs is
        lexical with it. fellBack is true when a model is configured but the vectors
        came from the offline algorithm anyway. Cached for ten minutes per backend;
        refresh=true forces a new measurement.
      parameters:
        - { name: refresh, in: query, required: false, schema: { type: boolean }, description: Re-measure instead of serving the cached report }
      responses:
        '200': { description: Embedding quality report, content: { application/json: { schema: { $ref: '#/components/schemas/EmbeddingQualityReport' } } } }
        '502': { $ref: '#/components/responses/Error' }
  /admin/security/encryption:
    get:
      operationId: get_admin_security_encryption
      tags: [Admin]
      summary: Inspect master-key rotation readiness
      responses:
        '200': { description: 'Primary key ID, fallback count and pending encrypted values', content: { application/json: { schema: { $ref: '#/components/schemas/EncryptionKeyStatus' } } } }
  /admin/security/encryption/rotate:
    post:
      operationId: post_admin_security_encryption_rotate
      tags: [Admin]
      summary: Transactionally re-encrypt secrets with the primary key
      description: Requires the previous key in ENCRYPTION_KEY_PREVIOUS until every stored value has been rotated and verified. OIDC and AI Gateway setting writes are serialized with rotation so masked saves cannot restore stale ciphertext.
      responses: { '200': { description: Rotation result }, '409': { $ref: '#/components/responses/Error' } }
  /admin/ai-evals:
    get:
      operationId: get_admin_ai_evals
      tags: [Admin, AI]
      summary: List Dream evaluation cases and their latest runs
      responses: { '200': { description: Evaluation cases } }
    post:
      operationId: post_admin_ai_evals
      tags: [Admin, AI]
      summary: Create a grounding and quality evaluation case
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AIEvalCaseWrite' } } }
      responses: { '201': { description: Evaluation case created } }
  /admin/ai-evals/{caseId}:
    parameters:
      - { $ref: '#/components/parameters/CaseID' }
    delete:
      operationId: delete_admin_ai_evals_caseId
      tags: [Admin, AI]
      summary: Delete an evaluation case and its run history
      responses: { '204': { description: Evaluation case deleted } }
  /admin/ai-evals/{caseId}/run:
    parameters:
      - { $ref: '#/components/parameters/CaseID' }
    post:
      operationId: post_admin_ai_evals_caseId_run
      tags: [Admin, AI]
      summary: Run a Dream evaluation against the configured gateway
      responses: { '200': { description: Scored evaluation result }, '502': { $ref: '#/components/responses/Error' } }
  /admin/dreams/run:
    post:
      operationId: post_admin_dreams_run
      tags: [Admin]
      summary: Manually enqueue eligible users
      responses: { '202': { description: Queued } }
  /admin/audit:
    get:
      operationId: get_admin_audit
      tags: [Admin]
      summary: Page through immutable audit events
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
        - { in: query, name: actor, schema: { type: string }, description: Username, or "system" for entries with no actor }
        - { in: query, name: action, schema: { type: string }, description: One of the actions the log holds }
        - { in: query, name: resourceType, schema: { type: string } }
        - { in: query, name: resourceId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses: { '200': { description: Audit events, the actions in use, and an opaque next cursor } }
  /admin/spaces:
    get:
      operationId: get_admin_spaces
      tags: [Admin]
      summary: List spaces with their owner, members and thought count
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: owner, schema: { type: string }, description: Restrict to one owner by username }
        - { in: query, name: ownerInactive, schema: { type: boolean }, description: Only spaces owned by a deactivated account }
      responses: { '200': { description: Spaces and opaque next cursor } }
  /admin/spaces/{spaceId}/members:
    get:
      operationId: get_admin_space_members
      tags: [Admin]
      summary: Who can reach one space, and with what permission
      parameters:
        - { $ref: '#/components/parameters/SpaceID' }
      responses: { '200': { description: The owner and every member } }
  /admin/spaces/{spaceId}/owner:
    put:
      operationId: put_admin_space_owner
      tags: [Admin]
      summary: Hand a space to another active user
      parameters:
        - { $ref: '#/components/parameters/SpaceID' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties: { userId: { type: string, format: uuid } }
      responses:
        '200': { description: The new owner, and whether the previous one kept access }
        '400': { description: An inbox, an inactive recipient, or already the owner }
        '404': { description: No such space or user }
  /admin/webhooks:
    get:
      operationId: get_admin_webhooks
      tags: [Admin]
      summary: Every webhook in the installation, worst first
      description: >-
        The destination is reported as scheme and host only. A hook address with
        a token in its path is itself the credential, so the path is not
        returned.
      parameters:
        - { in: query, name: failing, schema: { type: boolean }, description: Only webhooks with failures recorded }
      responses: { '200': { description: Webhooks with owner, destination, failures and waiting deliveries } }
  /admin/webhooks/{webhookId}/pause:
    post:
      operationId: post_admin_webhook_pause
      tags: [Admin]
      summary: Stop a webhook delivering without deleting its configuration
      parameters:
        - { in: path, name: webhookId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Paused, or already paused }
        '404': { description: No such webhook }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: umm_session }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: umm_key }
  parameters:
    SpaceID: { in: path, name: spaceId, required: true, schema: { type: string, format: uuid } }
    NoteID: { in: path, name: noteId, required: true, schema: { type: string, format: uuid } }
    CommentID: { in: path, name: commentId, required: true, schema: { type: string, format: uuid } }
    KeyID: { in: path, name: keyId, required: true, schema: { type: string, format: uuid } }
    WebhookID: { in: path, name: webhookId, required: true, schema: { type: string, format: uuid } }
    CaseID: { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    Cursor: { in: query, name: cursor, description: Opaque cursor returned as nextCursor, schema: { type: string } }
    IdempotencyKey: { in: header, name: Idempotency-Key, description: 'Replay-safe Canvas mutation key; the live-renewed 2-minute lease and response complete atomically with the mutation, and successful responses are retained for 24 hours', schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' } }
  responses:
    Error: { description: RFC 9457 Problem Details, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        error: { type: string, description: Backward-compatible alias for detail }
        requestId: { type: string }
        clientVersion: { type: integer }
        latest: { $ref: '#/components/schemas/Note' }
    Meta:
      type: object
      required: [serviceName, version, oidcEnabled, dreamEnabled, dreamAllowUserDisable, mcpProtocol]
      properties: { serviceName: { type: string }, version: { type: string }, oidcEnabled: { type: boolean }, dreamEnabled: { type: boolean }, dreamAllowUserDisable: { type: boolean }, mcpProtocol: { type: string } }
    Session:
      type: object
      required: [id, current, createdAt, lastSeenAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string, description: Reported browser, truncated for display }
        clientIp: { type: string }
        current: { type: boolean, description: True for the session making the request }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, displayName, role, active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, team_lead, admin] }
        teamId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
    Space:
      type: object
      required: [id, ownerId, name, color, aiExcluded, isInbox]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        aiExcluded: { type: boolean, description: Exclude every note in this space from AI processing and remote embedding gateways }
        isInbox: { type: boolean, description: Where unfiled captures land. An ordinary space in every other respect, but it cannot be deleted — removing it would leave captures with nowhere to go and the next one would silently make a new one. }
    DreamSource:
      type: object
      required: [noteId, title, excerpt, rank, similarityScore, cited]
      properties:
        noteId: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        rank: { type: integer, minimum: 1 }
        similarityScore: { type: number }
        cited: { type: boolean }
    DreamCandidate:
      type: object
      required: [dreamId, type, generatedAt, qualityScore, qualityLabel, status, spaceId, spaceName, content, rationale, suggestedAction, generation, sources]
      properties:
        dreamId: { type: string, format: uuid }
        type: { type: string, enum: [connection, question, expansion, contrarian, rediscovery, action, pattern] }
        generatedAt: { type: string, format: date-time }
        exposedAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        qualityScore: { type: number, minimum: 0, maximum: 1, description: Internal score; the UI presents qualityLabel instead }
        qualityLabel: { type: string, enum: [근거 충분, 새로운 연결, 검토 필요] }
        status: { type: string, enum: [created, exposed, kept, deleted] }
        noteId: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        spaceName: { type: string }
        content: { type: string }
        rationale: { type: string }
        suggestedAction: { type: string }
        generation: { type: integer, minimum: 1 }
        dismissedReason: { type: string }
        sources: { type: array, items: { $ref: '#/components/schemas/DreamSource' } }
    NoteWrite:
      type: object
      required: [content, x, y]
      properties:
        content: { type: string }
        title: { type: string }
        color: { type: string, enum: [yellow, blue, purple, green, red, gray, lavender] }
        kind:
          type: string
          enum: [thought, question, idea]
          default: thought
          description: |
            What the thought is. Marked, never inferred: umm does not read a note
            and decide it is a question. A value outside the vocabulary is
            rejected with 400 and an allowedKinds list rather than rewritten,
            which would file a thought as something the person did not say it was.
            "idea" is written when a Dream is materialised.
        aiExcluded: { type: boolean, description: Exclude this note from AI processing and remote embedding gateways }
        x: { type: number }
        y: { type: number }
        width: { type: number, minimum: 120 }
        height: { type: number, minimum: 80 }
        rotation: { type: number }
    Note:
      allOf:
        - { $ref: '#/components/schemas/NoteWrite' }
        - type: object
          required: [id, spaceId, authorId, source, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            spaceId: { type: string, format: uuid }
            authorId: { type: string, format: uuid }
            source: { type: string, enum: [user, dream, api, mcp] }
            version: { type: integer }
            relatedCount: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    NoteSearchResult:
      type: object
      required: [id, spaceId, spaceName, title, content, kind, updatedAt, score, reason]
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        spaceName: { type: string }
        title: { type: string }
        content: { type: string }
        kind:
          type: string
          enum: [thought, question, idea]
          default: thought
          description: |
            What the thought is. Marked, never inferred: umm does not read a note
            and decide it is a question. A value outside the vocabulary is
            rejected with 400 and an allowedKinds list rather than rewritten,
            which would file a thought as something the person did not say it was.
            "idea" is written when a Dream is materialised.
        updatedAt: { type: string, format: date-time }
        score: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
    NoteUpdate:
      allOf:
        - { $ref: '#/components/schemas/NoteWrite' }
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 0 }
    RelatedNote:
      type: object
      required: [note, score, reason]
      properties:
        note: { $ref: '#/components/schemas/Note' }
        score: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
    PresentationLink:
      type: object
      description: >-
        umm's record that a space produced a deck. Ptium owns the presentation
        and its slides; only the link is kept here, so nothing drifts when the
        deck is edited.
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        ptiumId: { type: string, description: Ptium's identifier for the deck. Opaque to umm. }
        title: { type: string }
        status: { type: string, enum: [pending, generating, ready, failed] }
        error: { type: string, description: What Ptium said, when it failed. }
        compiledSource: { type: string, description: The deck source umm sent. Omitted from list responses. }
        thoughtCount: { type: integer }
        excludedCount: { type: integer, description: Thoughts deliberately left out, so the count on screen is the real one. }
        createdBy: { type: string, format: uuid, nullable: true }
        url: { type: string, description: Where the deck can be opened. Computed on every read, never stored. Absent when no Ptium is configured. }
        staleSlides:
          type: integer
          description: >-
            How many of this deck's slides quote a thought that has since been
            rewritten or deleted. Moving a thought does not count: the check is
            on the words, not the note's version, which also changes when a note
            is dragged.
    SlideSource:
      type: object
      required: [slidePosition, noteId]
      properties:
        slidePosition:
          type: integer
          description: >-
            Position in the deck, one-based, rather than a Ptium slide id: a
            slide id changes when the deck is recompiled and umm has no way to
            learn that it did.
        noteId: { type: string, format: uuid }
    StaleSlide:
      type: object
      required: [slidePosition, noteId, reason]
      properties:
        slidePosition: { type: integer }
        noteId: { type: string, format: uuid }
        reason:
          type: string
          enum: [changed, deleted]
          description: >-
            A rewritten thought and a deleted one call for different things —
            one slide can be brought up to date, the other has lost its source
            entirely — so they are not collapsed into "out of date".
        content: { type: string, description: What the thought says now, so the change can be seen without leaving the deck. Empty for a deleted one. }
    PresentationPreview:
      type: object
      properties:
        storyline:
          type: object
          description: The talk in umm's own terms — order, grouping, and the author's sentences.
        source: { type: string, description: The same talk written in Ptium's deck source language. }
        slideCount: { type: integer, description: Present only when Ptium checked it. }
        warnings: { type: array, items: { type: string } }
        checked:
          type: boolean
          description: >-
            Whether Ptium measured this against a real template. False on a
            first preview, because Ptium can only dry-run source against a deck
            that already exists. Without this flag, a preview with no warnings
            and one that was never checked look identical.
    ThoughtCluster:
      type: object
      required: [id, label, noteIds, cohesion, basis]
      properties:
        id: { type: string }
        label: { type: string }
        noteIds: { type: array, items: { type: string, format: uuid } }
        cohesion:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Comparable only within one basis. For a meaning cluster it is an
            average similarity; for a proximity cluster it is a tightness of
            placement. Ranking across the two says nothing.
        basis:
          type: string
          enum: [meaning, proximity]
          description: |
            What grouped these notes. "meaning" when the embedding backend has
            been measured as semantic. "proximity" when it has not: at low zoom
            clusters replace the notes themselves, and grouping by shared
            vocabulary there produces a confidently wrong picture of the
            workspace. Where a note sits is something a person decided, so
            grouping by placement reports a real structure rather than an
            invented one — and a caller must present the two differently because
            they are different claims.
    NoteRevision:
      type: object
      required: [version, content, title, color, kind, x, y, width, height, rotation, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        content: { type: string }
        title: { type: string }
        color: { type: string }
        kind:
          type: string
          enum: [thought, question, idea]
          default: thought
          description: |
            What the thought is. Marked, never inferred: umm does not read a note
            and decide it is a question. A value outside the vocabulary is
            rejected with 400 and an allowedKinds list rather than rewritten,
            which would file a thought as something the person did not say it was.
            "idea" is written when a Dream is materialised.
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        rotation: { type: number }
        createdAt: { type: string, format: date-time }
    SpaceMember:
      type: object
      required: [id, username, displayName, email, permission]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        permission: { type: string, enum: [owner, view, edit, manage] }
    EdgeWrite:
      type: object
      required: [source, target]
      properties:
        source: { type: string, format: uuid }
        target: { type: string, format: uuid }
        relation:
          type: string
          default: related
          enum: [related, supports, contradicts, refines, expands, follows]
          description: |
            What the connection asserts. Omit it for a line that says only "these
            belong together". A value outside the vocabulary is rejected with 400
            and an allowedRelations list rather than being rewritten, so a
            connection is never recorded that the caller did not describe.
            Provenance is not a request field: see Edge.origin.
    Branch:
      type: object
      required: [id, spaceId, name, status, resolution]
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        rootNoteId: { type: string, format: uuid, description: The thought the line grew out of, when there is one }
        name: { type: string }
        status:
          type: string
          enum: [open, adopted, abandoned]
          description: |
            open is the ordinary state. adopted and abandoned are recorded by a
            person and always carry a reason.
        resolution: { type: string, description: Why it was adopted or set aside. Empty only while open. }
        resolvedAt: { type: string, format: date-time }
        notes: { type: integer, minimum: 0, description: Thoughts currently filed under this line }
    Edge:
      allOf:
        - { $ref: '#/components/schemas/EdgeWrite' }
        - type: object
          required: [id, spaceId, origin]
          properties:
            id: { type: string, format: uuid }
            spaceId: { type: string, format: uuid }
            origin:
              type: string
              enum: [manual, agent, dream, development, import, auto]
              description: |
                Who made the connection, set by the server and never accepted from
                a request body. manual is a line drawn through the web interface,
                agent one asserted through MCP, dream and development ones written
                when a Dream is accepted or developed, import one created while
                importing a document, and auto one umm inferred on its own.
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: |
                Present only when origin is auto. A person drawing a line is not
                expressing a probability, so it is absent for every other origin.
    Backlink:
      type: object
      required: [edge, note, direction]
      properties:
        edge: { $ref: '#/components/schemas/Edge' }
        note: { $ref: '#/components/schemas/Note' }
        direction: { type: string, enum: [incoming, outgoing] }
    Comment:
      type: object
      required: [id, noteId, authorId, author, username, body, mentions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        noteId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        author: { type: string }
        username: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        body: { type: string, maxLength: 4000 }
        mentions: { type: array, items: { type: string } }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewItem:
      type: object
      required: [id, spaceId, spaceName, title, content, pinned, updatedAt, reason]
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        spaceName: { type: string }
        title: { type: string }
        content: { type: string }
        pinned: { type: boolean }
        updatedAt: { type: string, format: date-time }
        reason: { type: string }
    OnboardingProgress:
      type: object
      required: [percent, steps]
      properties:
        completedAt: { type: [string, 'null'], format: date-time }
        percent: { type: integer, minimum: 0, maximum: 100 }
        steps:
          type: array
          items:
            type: object
            required: [key, label, description, done, target]
            properties: { key: { type: string }, label: { type: string }, description: { type: string }, done: { type: boolean }, target: { type: string } }
    TodayReview:
      type: object
      required: [review, orphans, dreams, activity, onboarding, counts]
      properties:
        review: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }
        orphans: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }
        dreams: { type: array, items: { type: object, additionalProperties: true } }
        activity: { type: array, items: { type: object, additionalProperties: true } }
        onboarding: { $ref: '#/components/schemas/OnboardingProgress' }
        counts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    WebhookWrite:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 2048, pattern: '^https://' }
        events: { type: array, minItems: 1, items: { type: string } }
    Webhook:
      allOf:
        - { $ref: '#/components/schemas/WebhookWrite' }
        - type: object
          required: [id, active, failureCount, lastError, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            failureCount: { type: integer, minimum: 0 }
            lastDeliveredAt: { type: [string, 'null'], format: date-time }
            lastError: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AIEvalCaseWrite:
      type: object
      required: [name, dreamType, inputNotes, expectedTerms, forbiddenTerms, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        dreamType: { type: string, enum: [connection, question, expansion, contrarian, rediscovery, action, pattern, free] }
        inputNotes: { type: array, minItems: 2, maxItems: 20, items: { type: string, maxLength: 1200 } }
        expectedTerms: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        forbiddenTerms: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        active: { type: boolean }
    MorningBrief:
      type: object
      required: [since, dreams, suggestions, unfiled, duplicates, contradictions, questions, skipped, quiet]
      properties:
        since: { type: string, format: date-time }
        dreams:
          type: array
          items:
            type: object
            required: [kind, count]
            properties: { kind: { type: string }, count: { type: integer, minimum: 1 } }
        suggestions: { type: integer, minimum: 0, description: Connections umm proposed that nobody has answered }
        unfiled: { type: integer, minimum: 0, description: Captured thoughts still sitting in the inbox }
        duplicates:
          type: array
          items:
            type: object
            required: [spaceId, space, first, second, score]
            properties:
              spaceId: { type: string, format: uuid }
              space: { type: string }
              first: { $ref: '#/components/schemas/Note' }
              second: { $ref: '#/components/schemas/Note' }
              score: { type: number }
              setAside:
                description: >
                  Present when exactly one of the two sits in a line that was decided
                  against. The pair then means work is being redone that someone
                  already chose not to do, and the reason comes with it. Absent when
                  both are in the same set-aside line, since the decision covers both.
                allOf:
                  - $ref: '#/components/schemas/Branch'
              setAsideNoteId:
                type: string
                format: uuid
                description: Which of the two is the one in that line.
        skipped:
          type: array
          description: What umm did not examine, so an empty list above is not read as an all-clear.
          items:
            type: object
            required: [kind, reason]
            properties:
              kind:
          type: string
          enum: [thought, question, idea]
          default: thought
          description: |
            What the thought is. Marked, never inferred: umm does not read a note
            and decide it is a question. A value outside the vocabulary is
            rejected with 400 and an allowedKinds list rather than rewritten,
            which would file a thought as something the person did not say it was.
            "idea" is written when a Dream is materialised.
              reason:
                type: string
                enum: [backend-not-semantic, disabled, space-too-large]
                description: >
                  space-too-large: finding duplicates compares every pair, so the work grows
                  with the square of the space. Past the bound only the most recent thoughts
                  were compared and the rest were left, which is reported rather than passed
                  over — a partial pass must not read as a clean bill of health.
        questions:
          type: array
          description: |
            Questions marked open with nothing recorded as answering them. Both
            halves are marked rather than inferred, so an empty list means nothing
            is marked open — not that everything has been answered.
          items:
            type: object
            required: [note, spaceId, space, attempts]
            properties:
              note: { $ref: '#/components/schemas/Note' }
              spaceId: { type: string, format: uuid }
              space: { type: string }
              attempts: { type: integer, minimum: 0 }
        contradictions:
          type: array
          description: |
            Disagreements someone recorded, capped for readability. umm does not
            detect these, so an empty list means nobody has marked any rather
            than that the workspace has none — the interface shows nothing at all
            in that case rather than a zero.
          items:
            type: object
            required: [edgeId, spaceId, space, claim, counter, origin]
            properties:
              edgeId: { type: string, format: uuid }
              spaceId: { type: string, format: uuid }
              space: { type: string }
              claim: { $ref: '#/components/schemas/Note' }
              counter: { $ref: '#/components/schemas/Note' }
              origin: { type: string }
        quiet: { type: boolean, description: Nothing to report and nothing skipped }
    SuggestionResult:
      type: object
      required: [outcome, edges, considered]
      properties:
        outcome:
          type: string
          enum: [suggested, no-candidates, backend-not-semantic, too-few-notes]
          description: |
            suggested — at least one connection was proposed. no-candidates — the
            backend can judge and nothing stood out. backend-not-semantic — the
            active embedding scores vocabulary above meaning, so umm declined to
            guess. too-few-notes — not enough notes to say what unusually similar
            means here.
        edges:
          type: array
          items: { $ref: '#/components/schemas/Edge' }
        considered: { type: integer, minimum: 0, description: Pairs scored, so a quiet result is distinguishable from no attempt }
    EmbeddingQualityReport:
      type: object
      required: [algorithm, model, classes, discrimination, pairwiseAccuracy, pairs, topicSeparation, neighbourPurity, sentences, accuracyBar, purityBar, semantic, fellBack]
      properties:
        algorithm: { type: string, description: Identifier of the algorithm that produced the vectors }
        model: { type: string, description: Configured model name; empty when no gateway model is set }
        classes:
          type: array
          items:
            type: object
            required: [class, mean, min, max, count]
            properties:
              class: { type: string, enum: [paraphrase, related, lexical-decoy, unrelated] }
              mean: { type: number }
              min: { type: number }
              max: { type: number }
              count: { type: integer, minimum: 1 }
        discrimination: { type: number, description: mean(paraphrase) - mean(lexical-decoy); negative means vocabulary outranks meaning }
        pairwiseAccuracy: { type: number, minimum: 0, maximum: 1 }
        pairs: { type: integer, minimum: 1 }
        topicSeparation: { type: number, description: mean(same-topic similarity) - mean(different-topic similarity) }
        neighbourPurity: { type: number, minimum: 0, maximum: 1, description: Fraction of sentences whose nearest match shares its topic; this is the question related thoughts and clustering ask }
        sentences: { type: integer, minimum: 1 }
        accuracyBar: { type: number, minimum: 0, maximum: 1, description: The pairwise-accuracy threshold this verdict was judged against, configurable under the intelligence settings }
        purityBar: { type: number, minimum: 0, maximum: 1, description: The same-topic-neighbour threshold this verdict was judged against }
        semantic: { type: boolean, description: Whether the backend is usable as a semantic layer }
        fellBack: { type: boolean, description: A model is configured but these vectors came from the offline algorithm }
    EncryptionKeyStatus:
      type: object
      required: [keyId, fallbackKeys, encryptedValues, pendingRotation, unreadable]
      properties:
        keyId: { type: string }
        fallbackKeys: { type: integer, minimum: 0 }
        encryptedValues: { type: integer, minimum: 0 }
        pendingRotation: { type: integer, minimum: 0 }
        unreadable: { type: integer, minimum: 0 }
    DevelopmentMaterialization:
      type: object
      required: [note, edge, created]
      properties:
        note: { $ref: '#/components/schemas/Note' }
        edge: { $ref: '#/components/schemas/Edge' }
        created: { type: boolean }
    Notification:
      type: object
      required: [id, kind, title, body, resourceType, resourceId, resourceSpaceId, metadata, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [thought, question, idea]
          default: thought
          description: |
            What the thought is. Marked, never inferred: umm does not read a note
            and decide it is a question. A value outside the vocabulary is
            rejected with 400 and an allowedKinds list rather than rewritten,
            which would file a thought as something the person did not say it was.
            "idea" is written when a Dream is materialised.
        title: { type: string }
        body: { type: string }
        resourceType: { type: string, enum: [dream, space, note] }
        resourceId: { type: [string, 'null'], format: uuid }
        resourceSpaceId: { type: [string, 'null'], format: uuid }
        metadata: { type: object, additionalProperties: true }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Preferences:
      type: object
      required: [dream_enabled, dream_frequency, dream_style, dream_notifications, include_old_notes, theme, locale, edge_style, review_digest]
      properties:
        dream_enabled: { type: boolean }
        dream_frequency: { type: string, enum: [daily, three_week, weekly] }
        dream_style: { type: string, enum: [auto, connection, question, expansion, free] }
        dream_notifications: { type: boolean }
        include_old_notes: { type: boolean }
        dream_pause_until: { type: [string, 'null'], format: date-time }
        theme: { type: string, enum: [light, dark, system] }
        locale: { type: string }
        edge_style: { type: string, enum: [bezier, smoothstep, straight], default: bezier }
        review_digest: { type: boolean, default: true }
    PreferencesPatch:
      type: object
      description: A presence-aware partial preference update; omitted fields are preserved.
      properties:
        dream_enabled: { type: boolean }
        dream_frequency: { type: string, enum: [daily, three_week, weekly] }
        dream_style: { type: string, enum: [auto, connection, question, expansion, free] }
