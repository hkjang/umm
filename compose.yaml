services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umm
      POSTGRES_USER: umm
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - umm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umm -d umm"]
      interval: 5s
      timeout: 3s
      retries: 20

  umm:
    build:
      context: .
      args:
        VERSION: 0.31.0
    image: umm:v0.31.0
    environment:
      POSTGRES_DSN: "postgres://umm:local-development-only@postgres:5432/umm?sslmode=disable&pool_max_conns=16"
      BOOTSTRAP_ADMIN: admin
      BOOTSTRAP_ADMIN_PASSWORD: change-this-before-production
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # umm's built-in embedding is a character n-gram fingerprint: it scores
  # sentences that share words above sentences that share meaning, so related
  # thoughts, clusters and search are lexical by default. Measured on umm's own
  # labelled data it ranks a paraphrase above a vocabulary decoy 4.2% of the time,
  # and only 18.8% of sentences have a same-topic nearest match. bge-m3 reaches
  # 83.3% and 75.0%.
  #
  # Bundling a real model into the umm image would mean linking an inference
  # runtime, which would end the CGO_ENABLED=0 static build that makes umm a
  # single portable binary. Running it beside umm keeps that intact and is still
  # fully offline: pull the model once, and the volume is all it needs after that.
  #
  #   docker compose --profile embeddings up -d
  #   docker compose exec embeddings ollama pull bge-m3
  #
  # Then set the AI Gateway to http://embeddings:11434 with embedding model
  # bge-m3, and confirm it took effect on Admin -> AI Gateway -> Embedding
  # quality. Candidates measured on the same data, including one that scores
  # higher on the labelled sets but fails umm's end-to-end clustering test, are
  # compared in docs/admin-guide.md.
  embeddings:
    profiles: [embeddings]
    image: ollama/ollama:latest
    volumes:
      - umm-embeddings:/root/.ollama
    environment:
      UMM_EMBEDDING_MODEL: bge-m3
    # Pulling on start is what makes this one command instead of two. The pull is
    # a no-op once the volume holds the model, so a restart costs nothing and a
    # machine with no network still comes up with whatever it already has.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$UMM_EMBEDDING_MODEL" || echo "pull failed; using what the volume already holds"
        wait $$server
    healthcheck:
      # Healthy means the model is actually present, not merely that the server
      # answers. Otherwise umm gets pointed at a gateway that 404s on first use.
      test: ["CMD-SHELL", "ollama list | grep -q \"$$UMM_EMBEDDING_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  umm-postgres:
  umm-embeddings:
