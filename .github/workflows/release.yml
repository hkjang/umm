name: Offline image release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Build offline image
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          docker build --build-arg "VERSION=${VERSION}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "umm:v${VERSION}" .
          docker save "umm:v${VERSION}" | gzip -9 -n > "umm-v${VERSION}.tar.gz"
          docker load < <(gzip -dc "umm-v${VERSION}.tar.gz")
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: umm:${{ github.ref_name }}
          format: spdx-json
          output-file: umm-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: sha256sum "umm-${GITHUB_REF_NAME}.tar.gz" "umm-${GITHUB_REF_NAME}.spdx.json" > SHA256SUMS
      - name: Attest image archive provenance
        uses: actions/attest@v4
        with:
          subject-path: umm-${{ github.ref_name }}.tar.gz
      - name: Attest image archive SBOM
        uses: actions/attest@v4
        with:
          subject-path: umm-${{ github.ref_name }}.tar.gz
          sbom-path: umm-${{ github.ref_name }}.spdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: umm ${{ github.ref_name }}
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            umm-${{ github.ref_name }}.tar.gz
            umm-${{ github.ref_name }}.spdx.json
            SHA256SUMS
          fail_on_unmatched_files: true
