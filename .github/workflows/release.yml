name: Offline image release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Build offline image
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          docker build --build-arg "VERSION=${VERSION}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "umm:v${VERSION}" .
          docker save "umm:v${VERSION}" | gzip -9 -n > "umm-v${VERSION}.tar.gz"
          docker load < <(gzip -dc "umm-v${VERSION}.tar.gz")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: umm ${{ github.ref_name }}
          generate_release_notes: true
          files: umm-${{ github.ref_name }}.tar.gz
          fail_on_unmatched_files: true
